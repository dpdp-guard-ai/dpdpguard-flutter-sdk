name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.0', channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart format --output=none --set-exit-if-changed lib test
